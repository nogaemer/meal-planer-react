<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 160 160">
    <defs>
        <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#cbf3bb" />
            <stop offset="100%" stop-color="#93bd57" />
        </linearGradient>
        <linearGradient id="fruitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#93DA97" />
